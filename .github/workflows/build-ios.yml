name: Build Releases (iOS IPA & Decky Plugin)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  build-release:
    name: Compile iOS IPA & Decky Plugin
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor iOS Project
        run: |
          cd client
          npx cap telemetry off || true
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd client/ios/App
          pod install --repo-update || pod install

      - name: Build iOS App with Xcodebuild
        run: |
          cd client/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ./build-output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package Unsigned Sideloadable IPA
        run: |
          cd client/ios/App
          rm -rf Payload OmniAchievements.ipa
          mkdir -p Payload
          cp -R ./build-output/Build/Products/Release-iphoneos/App.app Payload/
          chmod -R 755 Payload
          # -y preserves symbolic links in frameworks, preventing "Bad message" extraction errors
          zip -qry -9 OmniAchievements.ipa Payload
          # Verify integrity
          unzip -t OmniAchievements.ipa
          ls -lh OmniAchievements.ipa

      - name: Build & Package Decky Loader Plugin
        run: |
          cd decky-plugin
          npm install
          npm run build
          rm -f OmniAchievements-Decky.zip
          zip -r OmniAchievements-Decky.zip plugin.json package.json main.py dist index.js README.md
          unzip -t OmniAchievements-Decky.zip
          ls -lh OmniAchievements-Decky.zip

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniAchievements-iOS-IPA
          path: client/ios/App/OmniAchievements.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Decky Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniAchievements-Decky-Plugin
          path: decky-plugin/OmniAchievements-Decky.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish Release Packages to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine version tag from git ref or VERSION file
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
            if [ -z "$VERSION" ]; then
              VERSION="0.1.0"
            fi
            TAG="v$VERSION"
          fi
          echo "Target Release Version: $VERSION (Tag: $TAG)"

          IPA_PATH="client/ios/App/OmniAchievements.ipa"
          DECKY_PATH="decky-plugin/OmniAchievements-Decky.zip"

          RELEASE_TITLE="OmniAchievements v$VERSION"
          
          # Write clean release notes
          echo "### 📦 Release Downloads" > release_notes.md
          echo "- 🍏 **\`OmniAchievements.ipa\`**: Native iOS & iPadOS application package. Ready to install with **SideStore**, **AltStore**, **TrollStore**, or **Sideloadly**. *(Do NOT uncompress this file)*" >> release_notes.md
          echo "- 🕹️ **\`OmniAchievements-Decky.zip\`**: SteamOS / Decky Loader plugin for Steam Deck & other handhelds. Extract into \`~/homebrew/plugins/OmniAchievements\` and restart Decky. Supports 1-click in-Decky self-updating!" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🏷️ Version Scheme (a.b.c)" >> release_notes.md
          echo "- **\`a\`**: Main architecture version (current: \`0\`)" >> release_notes.md
          echo "- **\`b\`**: Major feature updates" >> release_notes.md
          echo "- **\`c\`**: Minor improvements and bug fixes" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📝 What's Changed in this Release" >> release_notes.md

          # Ensure all tags are fetched for changelog comparison
          git fetch --tags --force 2>/dev/null || true

          # Find previous tag (prior to current tag)
          PREV_TAG=$(git tag -l --sort=-v:refname "v*" | grep -v "^${TAG}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> release_notes.md
            echo "" >> release_notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          else
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${TAG}" >> release_notes.md
            echo "" >> release_notes.md
            git log -n 25 --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          fi
          echo "" >> release_notes.md

          # 1. Clean up legacy 'latest' pseudo-release and tag if present
          if gh release view "latest" >/dev/null 2>&1; then
            echo "Deleting legacy 'latest' pseudo-release to keep only numbered releases..."
            gh release delete "latest" -y --cleanup-tag || true
          fi

          # 2. Publish or update the numbered release (e.g. v0.2.0) with GitHub's 'Latest' badge
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading updated packages and marking as Latest..."
            gh release upload "$TAG" "$IPA_PATH" "$DECKY_PATH" --clobber
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file release_notes.md --latest
          else
            echo "Creating new numbered release $TAG with Latest tag..."
            gh release create "$TAG" "$IPA_PATH" "$DECKY_PATH" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              --latest
          fi
