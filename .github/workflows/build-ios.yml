name: Build iOS & iPadOS IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  CI: true

jobs:
  build-ipa:
    name: Compile iOS & iPadOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor iOS Project
        run: |
          cd client
          npx cap telemetry off || true
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd client/ios/App
          pod install --repo-update || pod install

      - name: Build iOS App with Xcodebuild
        run: |
          cd client/ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ./build-output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package Unsigned Sideloadable IPA
        run: |
          cd client/ios/App
          mkdir -p Payload
          cp -r ./build-output/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -9 OmniAchievements.ipa Payload
          ls -lh OmniAchievements.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniAchievements-iOS-IPA
          path: client/ios/App/OmniAchievements.ipa
          if-no-files-found: error
          retention-days: 30
