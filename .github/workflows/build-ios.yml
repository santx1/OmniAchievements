name: Build iOS & iPadOS IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile iOS / iPadOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Initialize Capacitor iOS
        run: |
          cd client
          npx cap add ios || true
          npx cap sync ios

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS App with Xcodebuild
        run: |
          cd client/ios/App
          pod install || true
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath App.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          cd client/ios/App
          mkdir -p build/Payload
          cp -r App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r OmniAchievements.ipa Payload
          mv OmniAchievements.ipa ../../../OmniAchievements.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniAchievements-iOS-IPA
          path: OmniAchievements.ipa
          retention-days: 30
