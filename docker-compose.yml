version: '3.8'

services:
  omniachievements:
    container_name: omniachievements
    image: ghcr.io/santx1/omniachievements:latest
    # To build from source locally instead of pulling from GHCR, uncomment the build section:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - MASTER_PASSWORD=${MASTER_PASSWORD:-changeme123}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-omni_super_secret_jwt_key_9918274}
    volumes:
      - ./data:/app/data
